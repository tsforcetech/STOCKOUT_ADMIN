
name: Publish STOCKOUT Admin to IIS

on:
  push:
    branches:
      - feature/admin-frontend
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stockout-dev-admin-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy STOCKOUT Admin

    runs-on:
      - self-hosted
      - windows
      - x64
      - stockout-dev-admin

    defaults:
      run:
        shell: powershell

    env:
      DEPLOY_PATH: C:\SHARACO\STOCKOUT\STOCKOUT_DEV_ADMIN
      BUILD_PATH: dist

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) {
            throw "npm ci failed"
          }

      - name: Build React Application
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_BASE_PATH: /
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) {
            throw "Build failed"
          }

      - name: Verify Build Output
        run: |
          if (!(Test-Path "$env:BUILD_PATH\index.html")) {
            throw "dist/index.html not found"
          }

          Write-Host "Build verified successfully"

      - name: Deploy to IIS
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE $env:BUILD_PATH
          $target = $env:DEPLOY_PATH

          Write-Host "Source: $source"
          Write-Host "Destination: $target"

          if (!(Test-Path $source)) {
            throw "Build output not found"
          }

          if (!(Test-Path $target)) {
            throw "IIS destination folder not found"
          }

          & robocopy $source $target /E /R:3 /W:2

          $copyResult = $LASTEXITCODE

          if ($copyResult -ge 8) {
            throw "Deployment failed: $copyResult"
          }

          Write-Host "Deployment completed successfully"

      - name: Deployment Summary
        run: |
          Write-Host "=================================="
          Write-Host "STOCKOUT ADMIN DEPLOYMENT SUCCESS"
          Write-Host "=================================="
          Write-Host "Branch: $env:GITHUB_REF_NAME"
          Write-Host "Commit: $env:GITHUB_SHA"
          Write-Host "Destination: $env:DEPLOY_PATH"
