
name: STOCKOUT Admin - IIS Deployment

on:
  push:
    branches:
      - feature/admin-frontend

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stockout-admin-iis-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy STOCKOUT Admin

    runs-on:
      - self-hosted
      - windows
      - x64
      - stockout-dev-admin

    defaults:
      run:
        shell: powershell

    env:
      DEPLOY_PATH: C:\SHARACO\STOCKOUT\STOCKOUT_DEV_ADMIN
      VITE_API_BASE_URL: https://stockout.flowb.io
      VITE_BASE_PATH: /
      VITE_REFRESH_TOKEN_STORAGE: local

    steps:
      # 1. Download source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          Write-Host "Installing dependencies..."

          npm ci

          if ($LASTEXITCODE -ne 0) {
            throw "npm install failed."
          }

      # 4. Build React + Vite application
      - name: Build React Application
        run: |
          Write-Host "Building STOCKOUT Admin..."
          Write-Host "API: $env:VITE_API_BASE_URL"

          npm run build

          if ($LASTEXITCODE -ne 0) {
            throw "React build failed."
          }

      # 5. Verify build output
      - name: Verify Build Output
        run: |
          $buildPath = Join-Path $env:GITHUB_WORKSPACE "dist"

          if (!(Test-Path $buildPath)) {
            throw "Build output directory not found."
          }

          if (!(Test-Path (Join-Path $buildPath "index.html"))) {
            throw "index.html not found in build output."
          }

          Write-Host "Build output verified."

      # 6. Create deployment destination if missing
      - name: Verify IIS Destination
        run: |
          if (!(Test-Path $env:DEPLOY_PATH)) {
            throw "IIS deployment folder does not exist: $env:DEPLOY_PATH"
          }

          Write-Host "IIS destination verified."

      # 7. Deploy compiled files to IIS
      - name: Deploy to IIS
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "dist"
          $target = $env:DEPLOY_PATH

          Write-Host "Starting STOCKOUT Admin deployment..."
          Write-Host "Source: $source"
          Write-Host "Destination: $target"

          & robocopy `
            $source `
            $target `
            /E `
            /R:3 `
            /W:2 `
            /NP

          $exitCode = $LASTEXITCODE

          if ($exitCode -ge 8) {
            throw "Deployment failed. Robocopy exit code: $exitCode"
          }

          Write-Host "Files deployed successfully."

      # 8. Verify deployed frontend
      - name: Verify IIS Deployment
        run: |
          $indexFile = Join-Path $env:DEPLOY_PATH "index.html"

          if (!(Test-Path $indexFile)) {
            throw "Deployment verification failed: index.html missing."
          }

          Write-Host "IIS deployment files verified."

      # 9. Deployment summary
      - name: Deployment Summary
        run: |
          Write-Host "======================================"
          Write-Host "STOCKOUT ADMIN DEPLOYMENT COMPLETED"
          Write-Host "======================================"
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Branch: $env:GITHUB_REF_NAME"
          Write-Host "Commit: $env:GITHUB_SHA"
          Write-Host "API URL: $env:VITE_API_BASE_URL"
          Write-Host "IIS Path: $env:DEPLOY_PATH"
          Write-Host "======================================"
