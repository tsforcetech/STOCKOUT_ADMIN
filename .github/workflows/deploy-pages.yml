name: CI & deploy to GitHub Pages

on:
  push:
    branches: [main, feature/admin-frontend]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # Built app calls the API gateway directly (GitHub Pages cannot proxy /api).
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://stockout.flowb.io' }}
  # Project site path: https://<owner>.github.io/<repo>/
  VITE_BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # SPA fallback: GitHub Pages serves 404.html for unknown paths, so deep links and refreshes work.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
